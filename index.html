// ── Round history helpers ─────────────────────────────────────────────────────
function loadHistory() {
  try { const r = localStorage.getItem(HISTORY_KEY); return r ? JSON.parse(r) : []; } catch { return []; }
}
function saveHistory(entry) {
  try {
    const hist = loadHistory();
    hist.unshift(entry);                          // newest first
    if (hist.length > MAX_HISTORY) hist.splice(MAX_HISTORY);
    localStorage.setItem(HISTORY_KEY, JSON.stringify(hist));
  } catch {}
}

// Always keep user-edited courses, but append any new DEFAULT_COURSES not yet in saved list.
// A default with a higher `rev` than the saved copy replaces it once (corrected course data).
function mergeCourses(saved) {
  if (!saved || !Array.isArray(saved)) return DEFAULT_COURSES;
  const defaults = new Map(DEFAULT_COURSES.map(c => [c.id, c]));
  const merged   = saved.map(c => {
    const d = defaults.get(c.id);
    return d && (d.rev ?? 0) > (c.rev ?? 0) ? d : c;
  });
  const savedIds = new Set(saved.map(c => c.id));
  const newOnes  = DEFAULT_COURSES.filter(c => !savedIds.has(c.id));
  return [...merged, ...newOnes];
}

function newBlankCourse(name, shortName, unit) {
  return {
    id: "c_" + Date.now(),
    name, shortName: shortName || name.slice(0,4).toUpperCase(), unit: unit || "m",

    holeInfo: Array.from({length:18}, (_,i) => hi(`Loch ${i+1}`, 350,null,null,null,null)),
    tees: JSON.parse(JSON.stringify(DEFAULT_COURSES[0].tees)),
  };
}

}

// ── Pure helpers ──────────────────────────────────────────────────────────────
// PHI = round( HCI × Slope/113 + (CR − Par) )
function calcPlayingHcp(hcpIndex, teeObj, par) {
  const idx = parseFloat(String(hcpIndex ?? "0").replace(",", ".")) || 0;
  if (!teeObj) return Math.round(idx);
  return Math.round(idx * (teeObj.slope / 113) + (teeObj.cr - par));
}
function strokesOnHole(playingHcp, holeHcp) {
  const hcp = Math.floor(playingHcp || 0);
  if (hcp <= 0) return 0;
  const full = Math.floor(hcp / 18), rem = hcp % 18;
  return full + (rem > 0 && holeHcp <= rem ? 1 : 0);
}
// Per-tee HCP: if hole has hcpByTee map, use it; else fall back to hole.hcp
function holeHcpForTee(hole, teeKey) {
  return hole.hcpByTee?.[teeKey] ?? hole.hcp;
}
function stablefordPts(netDiff) { return Math.max(0, 2 - netDiff); }
function diffLabel(d) { return d === 0 ? "E" : d > 0 ? `+${d}` : `${d}`; }

// ── WHS / DGV HCP-Berechnung ──────────────────────────────────────────────────
// Score Differential = (113 / Slope) × (Brutto − CR)
function calcScoreDiff(gross, cr, slope) {
  if (!gross || gross <= 0) return null;
  return Math.round((gross - cr) * 113 / slope * 10) / 10;
}
// Vereinfachte neue HCI-Schätzung für eine Runde (DGV-Näherung: Δ × 0,1)
function calcNewHCI(hciStr, diff) {
  if (diff === null) return null;
  const hci = parseFloat(String(hciStr).replace(",", ".")) || 0;
  return Math.round((hci + 0.1 * (diff - hci)) * 10) / 10;
}
// Spielvorgabe-Schlag-Label
function sLabel(extra) { return extra === 0 ? "" : extra === 1 ? "●" : "●●"; }

const ScoreBadge = memo(function ScoreBadge({val, par}) {
  if (val===""||val===undefined) return null;
  if (val==="NR") return <span style={{fontSize:13,color:MUTED,fontWeight:"bold",fontFamily:"monospace"}}>—</span>;
  const s=parseInt(val), d=s-par;
  const base={display:"inline-flex",alignItems:"center",justifyContent:"center",width:26,height:26,fontSize:13,fontWeight:"700",fontFamily:"monospace"};
  if (d<=-2) return <span style={{...base,color:RED,border:`2px solid ${RED}`,borderRadius:"50%",outline:`2px solid ${RED}`,outlineOffset:2}}>{s}</span>;
  if (d===-1) return <span style={{...base,color:RED,border:`2px solid ${RED}`,borderRadius:"50%"}}>{s}</span>;
  if (d===0)  return <span style={{...base,color:TEXT}}>{s}</span>;
  if (d===1)  return <span style={{...base,color:TEXT,border:`2px solid ${TEXT}`}}>{s}</span>;
  if (d===2)  return <span style={{...base,color:TEXT,border:`2px solid ${TEXT}`,outline:`2px solid ${TEXT}`,outlineOffset:2}}>{s}</span>;
  return <span style={{...base,color:"#7c3aed",border:"2px solid #7c3aed",borderRadius:3}}>{s}</span>;
});

// ═════════════════════════════════════════════════════════════════════════════
// ── GolfScorecard ─────────────────────────────────────────────────────────────
// ═════════════════════════════════════════════════════════════════════════════
// ── ScoreDetailModal ──────────────────────────────────────────────────────────
const ScoreDetailModal = memo(function ScoreDetailModal({
  playerName, playerHcp, playerTeeKey, tees,
  scores, holes, holeInfo, playingHcp, totalPar, unit, onClose,
}) {
  const tee = tees[playerTeeKey] || Object.values(tees)[0];

  // Per-hole data
  const rows = holes.map((hole, hi) => {
    const val   = scores[hi];
    const extra = strokesOnHole(playingHcp, holeHcpForTee(hole, playerTeeKey));
    const gross = (val !== "" && val !== "NR") ? parseInt(val) : null;
    const net   = gross !== null ? gross - extra : null;
    const pts   = val === "NR" ? 0 : net !== null ? stablefordPts(net - hole.par) : null;
    return { hole, val, extra, gross, net, pts };
  });

  // Totals
  const played18 = rows.filter(r => r.gross !== null).length;
  const played9f  = rows.slice(0,9).filter(r => r.gross !== null).length;
  const played9b  = rows.slice(9,18).filter(r => r.gross !== null).length;
  const bruttoAll = rows.reduce((a,r) => a + (r.gross||0), 0);
  const nettoAll  = rows.reduce((a,r) => a + (r.net||0), 0);
  const stblAll   = rows.reduce((a,r) => a + (r.pts||0), 0);
  const bruttoF   = rows.slice(0,9).reduce((a,r) => a + (r.gross||0), 0);
  const bruttoB   = rows.slice(9).reduce((a,r) => a + (r.gross||0), 0);
  const parF      = holes.slice(0,9).reduce((a,h)=>a+h.par,0);
  const parB      = holes.slice(9).reduce((a,h)=>a+h.par,0);

  // Determine round type and compute score diff + new HCI
  const is18 = played18 >= 15;
  const is9f = !is18 && played9f >= 7;
  const is9b = !is18 && !is9f && played9b >= 7;
  const roundLabel = is18 ? "18 Loch" : is9f ? "9 Loch (Front)" : is9b ? "9 Loch (Back)" : null;

  let diff = null, newHci = null, usedBrutto = null, usedCR = null, usedSlope = null;
  if (is18 && bruttoAll > 0) {
    usedBrutto = bruttoAll; usedCR = tee.cr; usedSlope = tee.slope;
    diff   = calcScoreDiff(bruttoAll, tee.cr, tee.slope);
    newHci = calcNewHCI(playerHcp, diff);
  } else if (is9f && bruttoF > 0) {
    usedBrutto = bruttoF; usedCR = Math.round(tee.cr/2*10)/10; usedSlope = tee.slope;
    diff   = calcScoreDiff(bruttoF, usedCR, tee.slope);
    newHci = calcNewHCI(playerHcp, diff);
  } else if (is9b && bruttoB > 0) {
    usedBrutto = bruttoB; usedCR = Math.round(tee.cr/2*10)/10; usedSlope = tee.slope;
    diff   = calcScoreDiff(bruttoB, usedCR, tee.slope);
    newHci = calcNewHCI(playerHcp, diff);
  }

  const hciNum  = parseFloat(String(playerHcp).replace(",",".")) || 0;
  const hciDelta = newHci !== null ? Math.round((newHci - hciNum)*10)/10 : null;

  const colH = {fontSize:10,color:MUTED,fontWeight:"normal",textAlign:"center",padding:"3px 2px",borderBottom:`1px solid ${LINE}`};
  const colD = (extra={}) => ({textAlign:"center",padding:"4px 2px",fontSize:13,borderBottom:`1px solid #f0ece4`,...extra});

  return (
    <div onClick={onClose} style={{position:"fixed",inset:0,zIndex:1100,background:"rgba(0,0,0,0.65)",display:"flex",alignItems:"center",justifyContent:"center",padding:10}}>
      <div onClick={e=>e.stopPropagation()} style={{background:CARD,borderRadius:16,width:"100%",maxWidth:420,maxHeight:"92vh",display:"flex",flexDirection:"column",overflow:"hidden",boxShadow:"0 20px 60px rgba(0,0,0,0.4)"}}>

        {/* Header */}
        <div style={{background:G,padding:"14px 16px",flexShrink:0}}>
          <div style={{fontSize:9,color:GOLD,letterSpacing:"0.2em",textTransform:"uppercase"}}>Scorekarte</div>
          <div style={{fontSize:19,color:"#fff",marginTop:2}}>{playerName}</div>
          <div style={{display:"flex",alignItems:"center",gap:8,marginTop:4}}>
            <TeeSwatch teeKey={playerTeeKey} size={11} tees={tees}/>
            <span style={{fontSize:11,color:"rgba(255,255,255,0.55)"}}>{tee.label}</span>
            <span style={{fontSize:11,color:GOLD,marginLeft:"auto"}}>HCI {hciNum} · PHI {playingHcp}</span>
          </div>
        </div>

        {/* Hole table */}
        <div style={{overflowY:"auto",flex:1}}>
          <table style={{width:"100%",borderCollapse:"collapse"}}>
            <thead>
              <tr style={{background:"#f0ece4"}}>
                <th style={{...colH,textAlign:"left",paddingLeft:8}}>Loch</th>
                <th style={colH}>Par</th>
                <th style={colH}>HCP</th>
                <th style={colH}>Vg.</th>
                <th style={colH}>Score</th>
                <th style={colH}>Netto</th>
                <th style={colH}>Pkt.</th>
              </tr>
            </thead>
            <tbody>
              {rows.map(({hole, val, extra, gross, net, pts}, i) => {
                const isBack = i === 9;
                const rowBg  = i%2===0 ? CARD : "#faf6f0";
                const pc     = hole.par===3?"#1d4ed8":hole.par===5?"#92400e":TEXT;
                const sc     = gross===null ? MUTED : gross-hole.par < 0 ? RED : gross-hole.par===0 ? G : "#92400e";
                return (
                  <React.Fragment key={hole.nr}>
                    {isBack && (
                      <tr style={{background:"#e8e2d4"}}>
                        <td style={{...colD({fontWeight:"bold",color:G,fontSize:11}),textAlign:"left",paddingLeft:8}}>OUT</td>
                        <td style={colD({fontWeight:"bold",color:G})}>{parF}</td>
                        <td style={colD()}/>
                        <td style={colD()}/>
                        <td style={colD({fontWeight:"bold"})}>{bruttoF||"—"}</td>
                        <td style={colD()}/>
                        <td style={colD({fontWeight:"bold",color:"#16a34a"})}>{rows.slice(0,9).reduce((a,r)=>a+(r.pts||0),0)}</td>
                      </tr>
                    )}
                    <tr style={{background:rowBg}}>
                      <td style={{...colD({fontWeight:"bold",color:G,fontSize:13}),textAlign:"left",paddingLeft:8}}>{hole.nr}</td>
                      <td style={colD({color:pc,fontWeight:"bold"})}>{hole.par}</td>
                      <td style={colD({color:MUTED,fontSize:11})}>{hole.hcp}</td>
                      <td style={colD({color:GOLD,fontSize:11,fontWeight:"bold"})}>{extra > 0 ? "●".repeat(extra) : "—"}</td>
                      <td style={colD({fontWeight:"bold",color:sc})}>
                        {val === "" ? <span style={{color:LINE}}>—</span>
                          : val === "NR" ? <span style={{color:MUTED,fontSize:11}}>NR</span>
                          : <span>{gross}</span>}
                      </td>
                      <td style={colD({color:MUTED,fontFamily:"monospace"})}>{net !== null ? net : "—"}</td>
                      <td style={colD({fontWeight:"bold",color:pts===null?LINE:pts>=2?"#16a34a":pts===1?G:RED,fontFamily:"monospace"})}>
                        {pts !== null ? pts : "—"}
                      </td>
                    </tr>
                  </React.Fragment>
                );
              })}
              {/* IN + Total */}
              <tr style={{background:"#e8e2d4"}}>
                <td style={{...colD({fontWeight:"bold",color:G,fontSize:11}),textAlign:"left",paddingLeft:8}}>IN</td>
                <td style={colD({fontWeight:"bold",color:G})}>{parB}</td>
                <td style={colD()}/><td style={colD()}/>
                <td style={colD({fontWeight:"bold"})}>{bruttoB||"—"}</td>
                <td style={colD()}/>
                <td style={colD({fontWeight:"bold",color:"#16a34a"})}>{rows.slice(9).reduce((a,r)=>a+(r.pts||0),0)}</td>
              </tr>
              <tr style={{background:G}}>
                <td style={{...colD({fontWeight:"bold",color:"#fff",fontSize:12}),textAlign:"left",paddingLeft:8}}>TOT</td>
                <td style={colD({fontWeight:"bold",color:GOLD})}>{totalPar}</td>
                <td style={colD()}/><td style={colD()}/>
                <td style={colD({fontWeight:"bold",color:"#fff",fontSize:15})}>{bruttoAll||"—"}</td>
                <td style={colD({fontWeight:"bold",color:GOLD,fontSize:13})}>{nettoAll||"—"}</td>
                <td style={colD({fontWeight:"bold",color:"#86efac",fontSize:15})}>{stblAll}</td>
              </tr>
            </tbody>
          </table>

          {/* HCP-Berechnung */}
          <div style={{padding:"14px 14px 8px",borderTop:`2px solid ${LINE}`}}>
            <div style={{fontSize:10,color:MUTED,letterSpacing:"0.15em",textTransform:"uppercase",marginBottom:10}}>
              Neue HCI-Schätzung {roundLabel ? `(${roundLabel})` : ""}
            </div>
            {diff !== null ? (
              <>
                {/* Formel */}
                <div style={{background:"#f0ece4",borderRadius:8,padding:"10px 12px",fontSize:11,color:TEXT,lineHeight:1.8,marginBottom:10}}>
                  <div style={{color:MUTED,marginBottom:2,fontSize:10}}>Score Differential (WHS)</div>
                  <div style={{fontFamily:"monospace",fontSize:12}}>
                    ({usedBrutto} − {usedCR}) × 113 ÷ {usedSlope}
                  </div>
                  <div style={{fontFamily:"monospace",fontSize:13,color:G,fontWeight:"bold",marginTop:2}}>
                    = {diff > 0 ? "+" : ""}{diff}
                  </div>
                  <div style={{color:MUTED,marginTop:6,marginBottom:2,fontSize:10}}>Neue HCI (Näherung)</div>
                  <div style={{fontFamily:"monospace",fontSize:12}}>
                    {hciNum} + 0,1 × ({diff} − {hciNum})
                  </div>
                  <div style={{display:"flex",alignItems:"center",gap:8,marginTop:4}}>
                    <span style={{fontFamily:"monospace",fontSize:18,fontWeight:"bold",color:newHci<=hciNum?G:RED}}>
                      {newHci}
                    </span>
                    <span style={{fontSize:13,color:hciDelta<=0?"#16a34a":"#ef4444",fontWeight:"bold"}}>
                      {hciDelta <= 0 ? `▼ ${Math.abs(hciDelta)}` : `▲ +${hciDelta}`}
                    </span>
                    <span style={{fontSize:10,color:MUTED}}>(war: {hciNum})</span>
                  </div>
                </div>
                <div style={{fontSize:9,color:MUTED,lineHeight:1.5,padding:"0 2px"}}>
                  ⚠ Näherungswert für eine Runde. Offizielle HCI-Anpassung erfolgt durch den DGV über die EGA-Vorgabenstelle (beste 8 aus 20 Runden × 0,96).
                </div>
              </>
            ) : (
              <div style={{fontSize:12,color:MUTED,fontStyle:"italic",padding:"4px 0"}}>
                {played18 + played9f + played9b > 0
                  ? `Zu wenig Löcher für eine HCI-Schätzung (${played18 || played9f || played9b} gespielt).`
                  : "Noch kein Score eingetragen."}
              </div>
            )}
          </div>
        </div>

        <button onClick={onClose} style={{width:"100%",padding:"13px",background:"transparent",border:"none",borderTop:`1px solid ${LINE}`,color:MUTED,fontSize:13,cursor:"pointer",fontFamily:"Georgia, serif",flexShrink:0}}>
          Schließen
        </button>
      </div>
    </div>
  );
});

    setHistory([]);

    const col = n <= 0 ? "#86efac" : "#fca5a5";

  };

  const tdS = (extra={}) => ({textAlign:"center",padding:"5px 3px",fontSize:10,
               borderBottom:`1px solid #f0ece4`,...extra});

  return (
    <div onClick={onClose} style={{position:"fixed",inset:0,zIndex:1200,background:"rgba(0,0,0,0.65)",
         display:"flex",alignItems:"center",justifyContent:"center",padding:10}}>

           maxWidth:420,maxHeight:"92vh",display:"flex",flexDirection:"column",overflow:"hidden",

        {/* Header */}
        <div style={{background:G,padding:"14px 16px",flexShrink:0}}>
          <div style={{fontSize:9,color:GOLD,letterSpacing:"0.2em",textTransform:"uppercase"}}>Rundenhistorie · Owner</div>
          <div style={{fontSize:19,color:"#fff",marginTop:2}}>{ownerName}</div>
          <div style={{fontSize:10,color:"rgba(255,255,255,0.5)",marginTop:3}}>
            Letzte {MAX_HISTORY} Runden · Player 1
          </div>
        </div>

        {/* Body */}
        <div style={{overflowY:"auto",flex:1}}>
          {history.length === 0 ? (
            <div style={{padding:32,textAlign:"center",color:MUTED}}>
              <div style={{fontSize:32,marginBottom:12}}>⛳</div>
              <div style={{fontSize:14}}>Noch keine abgeschlossenen Runden.</div>
              <div style={{fontSize:11,marginTop:8}}>

                    <th style={thS}>Par</th>
                    <th style={thS}>Brutto</th>
                    <th style={thS}>Netto</th>
                    <th style={thS}>Stbl.</th>
                    <th style={thS}>Neue HCI</th>
                  </tr>
                </thead>
                <tbody>
                  {history.map((r, i) => (
                    <tr key={i} style={{background: i%2===0 ? CARD : "#faf6f0"}}>
                      <td style={{...tdS({textAlign:"left",paddingLeft:10})}}>
                        <div style={{fontSize:9,color:MUTED}}>{r.date}</div>
                        <div style={{fontSize:10,color:G,fontWeight:"bold",
                             overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",maxWidth:100}}>
                          {r.shortName || r.course}
                        </div>
                        <div style={{fontSize:9,color:MUTED}}>{r.tee}</div>
                      </td>
                      <td style={tdS({fontFamily:"monospace",color:GOLD,fontWeight:"bold"})}>{r.hci}</td>
                      <td style={tdS({color:MUTED})}>{r.par}</td>
                      <td style={tdS({fontFamily:"monospace",fontWeight:"bold",
                           color: r.gross-r.par < 0 ? RED : r.gross-r.par===0 ? G : "#92400e"})}>
                        {r.gross}
                        <div style={{fontSize:8,color:MUTED}}>{r.gross>0?diffLabel(r.gross-r.par):""}</div>
                      </td>
                      <td style={tdS({fontFamily:"monospace",color:GOLD})}>{r.netto}</td>
                      <td style={tdS({fontFamily:"monospace",color:"#16a34a",fontWeight:"bold"})}>{r.stableford}</td>
                      <td style={tdS()}>
                        {r.newHci !== null ? (

                </tbody>
              </table>

              {/* Summary */}
              {history.length >= 2 && (() => {

                const avgGross = valid.length ? Math.round(valid.reduce((a,r)=>a+r.gross,0)/valid.length) : null;
                const avgStbl  = valid.length ? Math.round(valid.reduce((a,r)=>a+r.stableford,0)/valid.length*10)/10 : null;
                const best     = valid.length ? Math.min(...valid.map(r=>r.gross)) : null;

                        ["Ø Brutto", avgGross, "#fff"],

                        ["Akt. HCI", history[0]?.hci, GOLD],

                          <div style={{fontSize:16,fontWeight:"bold",color:col,fontFamily:"monospace"}}>{val??'—'}</div>

              <button onClick={clearHistory}
                style={{width:"calc(100% - 16px)",margin:"4px 8px 8px",padding:"10px",

                        color:MUTED,fontSize:11,cursor:"pointer",fontFamily:"Georgia, serif"}}>
                🗑 Verlauf löschen
              </button>
            </>
          )}
        </div>

        <button onClick={onClose} style={{width:"100%",padding:"13px",background:"transparent",
          border:"none",borderTop:`1px solid ${LINE}`,color:MUTED,fontSize:13,cursor:"pointer",
          fontFamily:"Georgia, serif",flexShrink:0}}>
          Schließen
        </button>
      </div>
    </div>
  );
});

function GolfScorecard() {
  const _s = loadSaved();

  const [courses,       setCourses]       = useState(() => mergeCourses(_s?.courses));
  const [activeCourseId,setActiveCourseId]= useState(() => _s?.activeCourseId ?? "gcgl");
  const [playerNames,   setPlayerNames]   = useState(() => _s?.playerNames    ?? DEFAULT_PLAYERS);
  const [playerHcps,    setPlayerHcps]    = useState(() => _s?.playerHcps     ?? DEFAULT_PLAYER_HCP);
  const [playerTees,    setPlayerTees]    = useState(() => _s?.playerTees     ?? DEFAULT_PLAYER_TEES);
  const [scores,        setScores]        = useState(() => _s?.scores         ?? DEFAULT_SCORES());
  const [savedAt,       setSavedAt]       = useState(() => _s?.savedAt        ?? null);

  const [half,          setHalf]          = useState("front");
  const [editingName,   setEditingName]   = useState(null);
  const [nameVal,       setNameVal]       = useState("");
  const [editingPar,    setEditingPar]    = useState(null);
  const [editingHcp,    setEditingHcp]    = useState(null);
  const [holeModal,     setHoleModal]     = useState(null);
  const [stepper,       setStepper]       = useState(null);
  const [teePicker,     setTeePicker]     = useState(null);
  const [courseModal,   setCourseModal]   = useState(false);
  const [confirmNew,    setConfirmNew]    = useState(false);
  const [confirmReset,  setConfirmReset]  = useState(false);
  const [scoreDetail,   setScoreDetail]   = useState(null);
  const [historyModal,  setHistoryModal]  = useState(false);
  const [toast,         setToast]         = useState(null);
  const nameRef = useRef(null);

  useEffect(()=>{ if (editingName!==null) nameRef.current?.focus(); },[editingName]);

  // Auto-save
  useEffect(()=>{
    try {
      const ts = new Date().toISOString();
      localStorage.setItem(SAVE_KEY, JSON.stringify({courses,activeCourseId,playerNames,playerHcps,playerTees,scores,savedAt:ts}));
      setSavedAt(ts);
    } catch {}
  },[courses,activeCourseId,scores,playerNames,playerHcps,playerTees]);

  // ── Active course (derived) ───────────────────────────────────────────────
  const activeCourse = useMemo(
    ()=>courses.find(c=>c.id===activeCourseId) ?? courses[0],
    [courses, activeCourseId]
  );
  const holes    = activeCourse.holes;
  const holeInfo = activeCourse.holeInfo;
  const tees     = activeCourse.tees;

  const frontPar     = useMemo(()=>holes.slice(0,9).reduce((a,h)=>a+h.par,0),[holes]);
  const backPar      = useMemo(()=>holes.slice(9,18).reduce((a,h)=>a+h.par,0),[holes]);
  const totalPar     = frontPar + backPar;
  const offset       = half==="back"?9:0;
  const displayHoles = useMemo(()=>half==="front"?holes.slice(0,9):half==="back"?holes.slice(9,18):holes,[half,holes]);
  const fmtSaved     = useMemo(()=>savedAt?new Date(savedAt).toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"}):null,[savedAt]);

  const playingHcps  = useMemo(
    ()=>playerHcps.map((hci,i)=>calcPlayingHcp(hci,tees[playerTees[i]],totalPar)),
    [playerHcps,playerTees,tees,totalPar]
  );

  // ── Callbacks ─────────────────────────────────────────────────────────────
  const showToast = useCallback(msg=>{setToast(msg);setTimeout(()=>setToast(null),2500);},[]);

  const setScore = useCallback((pi,hi,val)=>
    setScores(s=>{const n=s.map(r=>[...r]);n[pi][hi]=val;return n;}),[]);

  const setPlayerHcp = useCallback((pi,val)=>
    setPlayerHcps(h=>{const n=[...h];n[pi]=val;return n;}),[]);

  const commitPlayerHcp = useCallback(pi=>{
    setPlayerHcps(h=>{
      const n=[...h];
      const v=parseFloat(n[pi].replace(",","."))||0;
      const c=Math.max(0,Math.min(54,v));
      n[pi]=Number.isInteger(c)?String(c):c.toFixed(1);
      return n;
    });
  },[]);

  const setPlayerTee = useCallback((pi,key)=>
    setPlayerTees(t=>{const n=[...t];n[pi]=key;return n;}),[]);

  // Update a single hole field in the active course
  const updateCourseHole = useCallback((hi, updates)=>{
    setCourses(cs=>cs.map(c=>c.id===activeCourseId
      ?{...c, holes:c.holes.map((h,i)=>i===hi?{...h,...updates}:h)}
      :c
    ));
  },[activeCourseId]);

  // Update a tee field in the active course
  const updateCourseTee = useCallback((key,field,value)=>{
    setCourses(cs=>cs.map(c=>c.id===activeCourseId
      ?{...c, tees:{...c.tees,[key]:{...c.tees[key],[field]:value}}}
      :c
    ));
  },[activeCourseId]);

  const switchCourse = useCallback(id=>{
    setActiveCourseId(id);
    setPlayerTees(DEFAULT_PLAYER_TEES);
    showToast(`Platz gewechselt ⛳`);
  },[showToast]);

  const addCourse = useCallback((name,shortName,unit)=>{
    const nc = newBlankCourse(name,shortName,unit);
    setCourses(cs=>[...cs,nc]);
    setActiveCourseId(nc.id);
    setPlayerTees(DEFAULT_PLAYER_TEES);
    showToast(`„${name}" angelegt ✓`);
  },[showToast]);

  // ── Scoring ───────────────────────────────────────────────────────────────
  const grossScore = useCallback((pi,from,to)=>
    scores[pi].slice(from,to).reduce((a,v)=>(v===""||v==="NR")?a:a+(parseInt(v)||0),0),[scores]);

  const netScoreOnHole = useCallback((pi,hi)=>{
    const v=scores[pi][hi];
    if (v===""||v==="NR") return null;
    const g=parseInt(v);
    return isNaN(g)?null:g-strokesOnHole(playingHcps[pi],holeHcpForTee(holes[hi],playerTees[pi]));
  },[scores,playingHcps,holes,playerTees]);

  const totalNet = useCallback((pi,from,to)=>
    scores[pi].slice(from,to).reduce((a,_,i)=>a+(netScoreOnHole(pi,from+i)??0),0),[scores,netScoreOnHole]);

  const totalStableford = useCallback((pi,from,to)=>
    scores[pi].slice(from,to).reduce((a,v,i)=>{
      const hi=from+i;
      if (v==="NR") return a;
      const net=netScoreOnHole(pi,hi);
      return net===null?a:a+stablefordPts(net-holes[hi].par);
    },0),[scores,netScoreOnHole,holes]);

  const holesWon = useCallback((pi,from,to)=>{
    let won=0,halved=0;
    for (let hi=from;hi<to;hi++){
      const nets=[0,1,2,3].map(p=>netScoreOnHole(p,hi)).filter(v=>v!==null);
      const myNet=netScoreOnHole(pi,hi);
      if (myNet===null||nets.length<2) continue;
      const best=Math.min(...nets),bc=nets.filter(v=>v===best).length;
      if (myNet===best&&bc===1) won++;
      else if (myNet===best&&bc>1) halved++;
    }
    return {won,halved};
  },[netScoreOnHole]);

  const hasAnyScore = useCallback(pi=>scores[pi].some(v=>v!==""),[scores]);

  // ── Round management ──────────────────────────────────────────────────────
  const newRound = useCallback(()=>{
    // ── Save Player 1 (owner) round to history before clearing ────────────
    const pi = 0;
    const played = scores[pi].filter(v=>v!=="").length;
    if (played >= 7) {  // at least 7 holes
      const teeKey = playerTees[pi];
      const tee    = tees[teeKey] || Object.values(tees)[0];
      const phi    = playingHcps[pi];
      const brutto = scores[pi].reduce((a,v)=>(v===""||v==="NR")?a:a+(parseInt(v)||0),0);
      const netto  = brutto > 0 ? holes.reduce((a,h,hi)=>{
        const v=scores[pi][hi];
        if(v===""||v==="NR") return a;
        return a+(parseInt(v)||0)-strokesOnHole(phi,holeHcpForTee(h,teeKey));
      },0) : 0;
      const stblfd = played >= 7 ? holes.reduce((a,h,hi)=>{
        const v=scores[pi][hi];
        if(v==="NR") return a;
        const g=parseInt(v);
        if(isNaN(g)) return a;
        const net=g-strokesOnHole(phi,holeHcpForTee(h,teeKey));
        return a+stablefordPts(net-h.par);
      },0) : 0;
      // Score diff + new HCI
      const is18 = played >= 15;
      const is9  = !is18 && played >= 7;
      let diff=null, newHci=null;
      if (is18 && brutto>0) {
        diff   = calcScoreDiff(brutto, tee.cr, tee.slope);
        newHci = calcNewHCI(playerHcps[pi], diff);
      } else if (is9 && brutto>0) {
        diff   = calcScoreDiff(brutto, Math.round(tee.cr/2*10)/10, tee.slope);
        newHci = calcNewHCI(playerHcps[pi], diff);
      }
      const hciNum  = parseFloat(String(playerHcps[pi]).replace(",","."))||0;
      const hciDelta = newHci !== null ? Math.round((newHci-hciNum)*10)/10 : null;
      saveHistory({
        date:       new Date().toLocaleDateString("de-DE"),
        course:     activeCourse.name,
        shortName:  activeCourse.shortName,
        tee:        tee.label || teeKey,
        par:        totalPar,
        hci:        hciNum,
        phi:        phi,
        holesPlayed:played,
        gross:      brutto,
        netto:      netto,
        stableford: stblfd,
        diff:       diff,
        newHci:     newHci,
        hciDelta:   hciDelta,
      });
    }
    setScores(DEFAULT_SCORES());
    localStorage.removeItem(SAVE_KEY); setSavedAt(null); setConfirmNew(false);
    showToast("Neue Runde gestartet ⛳");
  },[showToast, scores, playerTees, tees, playingHcps, playerHcps, holes, activeCourse, totalPar]);

  const resetAll = useCallback(()=>{
    setCourses(DEFAULT_COURSES); setActiveCourseId("gcgl");
    setPlayerNames(DEFAULT_PLAYERS); setPlayerHcps(DEFAULT_PLAYER_HCP);
    setPlayerTees(DEFAULT_PLAYER_TEES); setScores(DEFAULT_SCORES());
    localStorage.removeItem(SAVE_KEY); setSavedAt(null); setConfirmReset(false);
    showToast("Alles zurückgesetzt 🗑");
  },[showToast]);

  // ── Render ────────────────────────────────────────────────────────────────
  return (
    <div style={{minHeight:"100vh",background:BG,fontFamily:"Georgia, serif",color:TEXT}}>

      {/* ── Modals ── */}
      {courseModal && (
        <CourseManagerModal
          courses={courses} activeCourseId={activeCourseId} totalPar={totalPar}
          onSwitchCourse={switchCourse} onUpdateTee={updateCourseTee}
          onAddCourse={addCourse} onClose={()=>setCourseModal(false)}
        />
      )}
      {holeModal && (
        <HoleModal holeNr={holeModal} hole={holes[holeModal-1]}
          holeInfo={holeInfo[holeModal-1]} tees={tees}
          onClose={()=>setHoleModal(null)}
        />
      )}
      {teePicker!==null && (
        <TeePickerModal playerName={playerNames[teePicker]} currentTee={playerTees[teePicker]} tees={tees}
          onSelect={key=>setPlayerTee(teePicker,key)} onClose={()=>setTeePicker(null)}
        />
      )}
      {historyModal && (
        <HistoryModal ownerName={playerNames[0]} onClose={()=>setHistoryModal(false)}/>
      )}
      {confirmNew  && <ConfirmModal message="Scores löschen und neue Runde starten? Spielernamen bleiben." confirmLabel="New Round"    onConfirm={newRound}  onCancel={()=>setConfirmNew(false)}/>}
      {confirmReset && <ConfirmModal message="Alles zurücksetzen inkl. Plätze und Spielernamen?"           confirmLabel="Alles löschen" onConfirm={resetAll} onCancel={()=>setConfirmReset(false)}/>}
      {scoreDetail !== null && (
        <ScoreDetailModal
          playerName={playerNames[scoreDetail]}
          playerHcp={playerHcps[scoreDetail]}
          playerTeeKey={playerTees[scoreDetail]}
          tees={tees}
          scores={scores[scoreDetail]}
          holes={holes}
          holeInfo={holeInfo}
          playingHcp={playingHcps[scoreDetail]}
          totalPar={totalPar}
          unit={activeCourse.unit}
          onClose={()=>setScoreDetail(null)}
        />
      )}
      {stepper && (
        <StepperModal hole={stepper.hole} holeInfo={holeInfo[stepper.hole.nr-1]}
          playerName={playerNames[stepper.pi]} currentVal={scores[stepper.pi][stepper.hi]}
          onSave={val=>setScore(stepper.pi,stepper.hi,val)} onClose={()=>setStepper(null)}
        />
      )}
      {toast && (
        <div style={{position:"fixed",bottom:28,left:"50%",transform:"translateX(-50%)",background:G,color:"#fff",padding:"10px 22px",borderRadius:20,fontSize:12,zIndex:3000,boxShadow:"0 4px 20px rgba(0,0,0,0.3)",whiteSpace:"nowrap"}}>
          {toast}
        </div>
      )}

      {/* ── Header ── */}
      <div style={{background:G,padding:"10px 14px",display:"flex",alignItems:"center",justifyContent:"space-between"}}>
        <div onClick={()=>setCourseModal(true)} style={{cursor:"pointer"}}>
          <div style={{fontSize:9,letterSpacing:"0.25em",color:GOLD,textTransform:"uppercase",marginBottom:1}}>
            {activeCourse.shortName} · Scorecard
          </div>
          <div style={{fontSize:17,color:"#fff",fontWeight:"normal",display:"flex",alignItems:"center",gap:6}}>
            {activeCourse.name}
            <span style={{fontSize:13,color:"rgba(255,255,255,0.35)",lineHeight:1}}>ⓘ</span>
          </div>
        </div>
        <div style={{display:"flex",gap:5,alignItems:"flex-end"}}>
          {/* 4 equal-size buttons */}
          {[
            {
              onClick: ()=>setHistoryModal(true),
              line1: "📋", line2: "Last", line3: "Rounds",
              bg: "rgba(255,255,255,0.1)", border: `1px solid ${GOLD}55`,
              color: "rgba(255,255,255,0.8)",
            },
            {
              onClick: ()=>window.print(),
              line1: "⬇", line2: "Send", line3: "PDF",
              bg: "rgba(201,168,76,0.15)", border: `1px solid ${GOLD}`,
              color: GOLD,
            },
            {
              onClick: ()=>setConfirmNew(true),
              line1: "", line2: "New", line3: "Round",
              bg: "rgba(255,255,255,0.1)", border: "1px solid rgba(255,255,255,0.25)",
              color: "rgba(255,255,255,0.85)",
            },
          ].map((btn,i) => (
            <button key={i} onClick={btn.onClick}
              style={{
                background: btn.bg, border: btn.border, borderRadius: 9,
                width: 52, height: 46, cursor: "pointer",
                display: "flex", flexDirection: "column",
                alignItems: "center", justifyContent: "center",
                color: btn.color, fontFamily: "Georgia, serif", lineHeight: 1.15,
                padding: 0,
              }}>
              {btn.line1 && <span style={{fontSize:14,lineHeight:1}}>{btn.line1}</span>}
              <span style={{fontSize:9,fontWeight:"bold",letterSpacing:"0.03em"}}>{btn.line2}</span>
              <span style={{fontSize:9,letterSpacing:"0.03em"}}>{btn.line3}</span>
            </button>
          ))}
          {/* Trash + version stacked */}
          <div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:2}}>
            <span style={{fontSize:10,color:"rgba(255,255,255,0.35)",letterSpacing:"0.04em",lineHeight:1}}>{APP_VERSION}</span>
            <button onClick={()=>setConfirmReset(true)} title="Alles zurücksetzen"
              style={{
                background:"rgba(255,0,0,0.18)", border:"1px solid rgba(255,100,100,0.35)",
                borderRadius:9, width:38, height:38,
                color:"rgba(255,180,180,0.9)", cursor:"pointer", fontSize:16, lineHeight:1,
                display:"flex", alignItems:"center", justifyContent:"center",
              }}>
              🗑
            </button>
          </div>
        </div>
      </div>

      {/* ── Save indicator ── */}
      <div style={{background:GL,padding:"2px 14px",display:"flex",justifyContent:"flex-end"}}>
        <span style={{fontSize:8,color:"rgba(255,255,255,0.4)",letterSpacing:"0.05em"}}>
          {fmtSaved?`✓ Auto-saved ${fmtSaved}`:"Not saved yet"}
        </span>
      </div>

      {/* ── Player header ── */}
      <div style={{background:GL,display:"flex",padding:"5px 8px",gap:4}}>
        <div style={{width:84,flexShrink:0}}>
          <div style={{fontSize:9,color:"rgba(255,255,255,0.4)",textAlign:"center",paddingTop:4,letterSpacing:"0.05em"}}>NAME</div>
          <div style={{fontSize:9,color:GOLD,textAlign:"center",paddingTop:7,letterSpacing:"0.05em"}}>HCI</div>
          <div style={{fontSize:9,color:"rgba(255,255,255,0.35)",textAlign:"center",paddingTop:6,letterSpacing:"0.05em"}}>PHI</div>
          <div style={{fontSize:9,color:"rgba(255,255,255,0.35)",textAlign:"center",paddingTop:6,letterSpacing:"0.05em"}}>ABSCHL.</div>
        </div>
        {playerNames.map((name,i)=>{
          const tee=tees[playerTees[i]]||Object.values(tees)[0];
          return (
            <div key={i} style={{flex:1,minWidth:0}}>
              {editingName===i?(
                <input ref={nameRef} value={nameVal}
                  onChange={e=>setNameVal(e.target.value)}
                  onFocus={e=>e.target.select()}
                  onBlur={()=>{const ns=[...playerNames];ns[i]=nameVal.trim()||`Player ${i+1}`;setPlayerNames(ns);setEditingName(null);}}
                  onKeyDown={e=>e.key==="Enter"&&nameRef.current?.blur()}
                  style={{background:"transparent",border:"none",borderBottom:`2px solid ${GOLD}`,color:"#fff",fontSize:16,outline:"none",width:"100%",textAlign:"center",fontFamily:"Georgia, serif",padding:"1px 0"}}/>
              ):(
                <div onClick={()=>{setEditingName(i);setNameVal(name);}}
                  style={{color:"#fff",fontSize:14,fontWeight:"bold",textAlign:"center",cursor:"text",padding:"2px",borderBottom:"1px solid rgba(255,255,255,0.15)",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>
                  {name}
                </div>
              )}
              <input type="text" inputMode="decimal" pattern="[0-9]*[.,]?[0-9]?"
                value={playerHcps[i]}
                onChange={e=>setPlayerHcp(i,e.target.value.replace(/[^0-9.,]/g,"").replace(/([.,].*)[.,]/g,"$1"))}
                onFocus={e=>e.target.select()}
                onBlur={()=>commitPlayerHcp(i)}
                style={{marginTop:3,background:"rgba(0,0,0,0.2)",border:"none",borderBottom:`1px solid ${GOLD}`,color:GOLD,fontSize:15,outline:"none",width:"100%",textAlign:"center",fontFamily:"monospace",padding:"1px 0",fontWeight:"bold"}}/>
              <div style={{marginTop:4,textAlign:"center",fontSize:13,color:"rgba(255,255,255,0.65)",fontFamily:"monospace",fontWeight:"bold"}}>
                {playingHcps[i]}
              </div>
              <div onClick={()=>setTeePicker(i)}
                style={{marginTop:4,display:"flex",alignItems:"center",justifyContent:"center",gap:4,cursor:"pointer",padding:"2px 0"}}>
                <TeeSwatch teeKey={playerTees[i]} size={11} tees={tees}/>
                <span style={{fontSize:10,color:"rgba(255,255,255,0.5)"}}>{tee.short}</span>
              </div>
            </div>
          );
        })}
      </div>

      {/* ── Tabs ── */}
      <div style={{display:"flex",background:G,borderBottom:`2px solid ${G}`}}>
        {[["front","Front 9"],["back","Back 9"],["total","All 18"]].map(([key,label])=>(
          <button key={key} onClick={()=>setHalf(key)}
            style={{flex:1,padding:"8px 4px",background:half===key?"#fff":"transparent",color:half===key?G:"rgba(255,255,255,0.55)",border:"none",cursor:"pointer",fontSize:13,letterSpacing:"0.04em",fontFamily:"Georgia, serif",fontWeight:half===key?"bold":"normal",borderRadius:half===key?"4px 4px 0 0":0}}>
            {label}
          </button>
        ))}
      </div>

      {/* ── Scorecard table ── */}
      <div style={{overflowX:"auto"}}>
        <table style={{width:"100%",borderCollapse:"collapse",background:CARD,tableLayout:"fixed"}}>
          <colgroup>
            <col style={{width:28}}/><col style={{width:28}}/><col style={{width:28}}/>
            <col/><col/><col/><col/>
          </colgroup>
          <thead>
            <tr style={{background:G}}>
              <th style={cs({color:"#fff",fontSize:8,letterSpacing:"0.1em",fontWeight:"normal"})}>HO</th>
              <th style={cs({color:GOLD,fontSize:8,letterSpacing:"0.1em",fontWeight:"normal"})}>HCP</th>
              <th style={cs({color:"#fff",fontSize:8,letterSpacing:"0.1em",fontWeight:"normal"})}>PAR</th>
              {playerNames.map((name,i)=>(
                <th key={i} style={cs({color:"#fff",fontSize:12,fontWeight:"bold"})}>
                  {name.length>6?name.slice(0,5)+"…":name}
                </th>
              ))}
            </tr>
          </thead>
          <tbody>
            {displayHoles.map((hole,di)=>{
              const hi=di+offset, isOdd=di%2===0;
              return (
                <tr key={hole.nr} style={{background:isOdd?CARD:"#f9f5ec"}}>
                  <td style={CS_HO} onClick={()=>setHoleModal(hole.nr)}>
                    <span style={{textDecoration:"underline",textDecorationStyle:"dotted",textDecorationColor:GOLD}}>{hole.nr}</span>
                  </td>
                  <td style={CS_HCP} onClick={()=>setEditingHcp(editingHcp===hi?null:hi)}>
                    {editingHcp===hi?(
                      <select autoFocus value={hole.hcp}
                        onChange={e=>{updateCourseHole(hi,{hcp:parseInt(e.target.value)});setEditingHcp(null);}}
                        onBlur={()=>setEditingHcp(null)}
                        style={{border:"none",background:GOLD,color:G,fontWeight:"bold",fontSize:16,borderRadius:3,width:34,cursor:"pointer",fontFamily:"Georgia, serif"}}>
                        {HCP_OPTS.map(v=><option key={v} value={v}>{v}</option>)}
                      </select>
                    ):(
                      <span style={{fontSize:13,color:MUTED}}>{hole.hcp}</span>
                    )}
                  </td>
                  <td style={CS_PAR} onClick={()=>setEditingPar(editingPar===hi?null:hi)}>
                    {editingPar===hi?(
                      <select autoFocus value={hole.par}
                        onChange={e=>{updateCourseHole(hi,{par:parseInt(e.target.value)});setEditingPar(null);}}
                        onBlur={()=>setEditingPar(null)}
                        style={{border:"none",background:GOLD,color:G,fontWeight:"bold",fontSize:16,borderRadius:3,width:34,cursor:"pointer",fontFamily:"Georgia, serif"}}>
                        <option value={3}>3</option><option value={4}>4</option><option value={5}>5</option>
                      </select>
                    ):(
                      <span style={{display:"inline-block",background:hole.par===3?"#e8f4fd":hole.par===5?"#fef3e2":"transparent",color:hole.par===3?"#1d4ed8":hole.par===5?"#92400e":TEXT,borderRadius:3,padding:"0 3px",fontSize:13,fontWeight:"bold"}}>
                        {hole.par}
                      </span>
                    )}
                  </td>
                  {[0,1,2,3].map(pi=>{
                    const val=scores[pi][hi], extra=strokesOnHole(playingHcps[pi],holeHcpForTee(hole,playerTees[pi]));
                    return (
                      <td key={pi} style={cs({padding:0,cursor:"pointer"})} onClick={()=>setStepper({hole,pi,hi})}>
                        <div style={{position:"relative",display:"flex",alignItems:"center",justifyContent:"center",height:38}}>
                          {extra>0&&(
                            <div style={{position:"absolute",top:3,right:3,zIndex:2,pointerEvents:"none"}}>
                              {Array.from({length:extra},(_,k)=>(
                                <span key={k} style={{display:"inline-block",width:5,height:5,borderRadius:"50%",background:GOLD,marginLeft:1}}/>
                              ))}
                            </div>
                          )}
                          {val!==""?<ScoreBadge val={val} par={hole.par}/>:<span style={{color:LINE,fontSize:20}}>+</span>}
                        </div>
                      </td>
                    );
                  })}
                </tr>
              );
            })}

            {/* OUT/IN subtotal */}
            {half!=="total"&&(()=>{
              const from=half==="front"?0:9, to=half==="front"?9:18;
              const par=half==="front"?frontPar:backPar;
              return (
                <tr style={{background:"#e8e2d4",borderTop:`2px solid ${G}`}}>
                  <td colSpan={2} style={cs({fontWeight:"bold",fontSize:12,color:G})}>{half==="front"?"OUT":"IN"}</td>
                  <td style={cs({fontWeight:"bold",color:G,fontSize:14})}>{par}</td>
                  {[0,1,2,3].map(pi=>{
                    const s=grossScore(pi,from,to), d=s>0?s-par:null;
                    return (
                      <td key={pi} style={cs({fontWeight:"bold"})}>
                        {s>0?(<div><div style={{fontSize:14}}>{s}</div><div style={{fontSize:11,color:d===0?MUTED:d<0?RED:"#92400e"}}>{diffLabel(d)}</div></div>):"—"}
                      </td>
                    );
                  })}
                </tr>
              );
            })()}

            {/* All-18 OUT+IN rows */}
            {half==="total"&&[["OUT",0,9,frontPar],["IN",9,18,backPar]].map(([label,from,to,par])=>(
              <tr key={label} style={{background:"#e8e2d4",borderTop:label==="OUT"?`2px solid ${G}`:"none"}}>
                <td colSpan={2} style={cs({fontWeight:"bold",fontSize:12,color:G})}>{label}</td>
                <td style={cs({fontWeight:"bold",color:G,fontSize:14})}>{par}</td>
                {[0,1,2,3].map(pi=>{
                  const s=grossScore(pi,from,to);
                  return <td key={pi} style={cs({fontWeight:"bold",fontSize:14})}>{s||"—"}</td>;
                })}
              </tr>
            ))}
          </tbody>
        </table>
      </div>

      {/* ── Results footer ── */}
      <div style={{background:G,padding:"12px 10px"}}>
        <div style={{fontSize:11,color:GOLD,letterSpacing:"0.2em",textTransform:"uppercase",marginBottom:8}}>Total — Par {totalPar}</div>
        <div style={{display:"flex",gap:5}}>
          {playerNames.map((name,pi)=>{
            const brutto=grossScore(pi,0,18),netto=totalNet(pi,0,18),stbl=totalStableford(pi,0,18);
            const {won,halved}=holesWon(pi,0,18);
            const bD=brutto>0?brutto-totalPar:null, nD=brutto>0?netto-totalPar:null;
            const has=hasAnyScore(pi), tee=tees[playerTees[pi]]||Object.values(tees)[0];
            // New HCI estimate
            const played18 = scores[pi].filter(v=>v!=="").length;
            const played9f  = scores[pi].slice(0,9).filter(v=>v!=="").length;
            const played9b  = scores[pi].slice(9).filter(v=>v!=="").length;
            const bruttoF   = grossScore(pi,0,9), bruttoB = grossScore(pi,9,18);
            let diff=null, newHci=null;
            if (played18>=15 && brutto>0) {
              diff=calcScoreDiff(brutto,tee.cr,tee.slope);
              newHci=calcNewHCI(playerHcps[pi],diff);
            } else if (played9f>=7 && bruttoF>0) {
              diff=calcScoreDiff(bruttoF,Math.round(tee.cr/2*10)/10,tee.slope);
              newHci=calcNewHCI(playerHcps[pi],diff);
            } else if (played9b>=7 && bruttoB>0) {
              diff=calcScoreDiff(bruttoB,Math.round(tee.cr/2*10)/10,tee.slope);
              newHci=calcNewHCI(playerHcps[pi],diff);
            }
            const hciNum=parseFloat(String(playerHcps[pi]).replace(",","."))||0;
            const hciDelta=newHci!==null?Math.round((newHci-hciNum)*10)/10:null;
            return (
              <div key={pi} onClick={()=>setScoreDetail(pi)}
                style={{flex:1,background:"rgba(255,255,255,0.08)",borderRadius:8,overflow:"hidden",border:"1px solid rgba(255,255,255,0.1)",cursor:"pointer",transition:"background 0.15s"}}
                onMouseEnter={e=>e.currentTarget.style.background="rgba(255,255,255,0.14)"}
                onMouseLeave={e=>e.currentTarget.style.background="rgba(255,255,255,0.08)"}>
                <div style={{background:"rgba(0,0,0,0.15)",padding:"4px 4px 3px",textAlign:"center",borderBottom:"1px solid rgba(255,255,255,0.1)"}}>
                  <div style={{fontSize:14,fontWeight:"bold",color:"rgba(255,255,255,0.85)",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>
                    {name.length>8?name.slice(0,7)+"…":name}
                  </div>
                  <div style={{display:"flex",alignItems:"center",justifyContent:"center",gap:4,marginTop:2}}>
                    <TeeSwatch teeKey={playerTees[pi]} size={8} tees={tees}/>
                    <span style={{fontSize:9,color:"rgba(255,255,255,0.4)"}}>{tee.short}</span>
                  </div>
                  <div style={{fontSize:10,color:GOLD,marginTop:1}}>
                    HCI {parseFloat(playerHcps[pi])||0} · PHI <strong style={{color:"#fff"}}>{playingHcps[pi]}</strong>
                  </div>
                </div>
                {[
                  {lbl:"Brutto", val:has?(brutto||"—"):"—", color:"#fff", size:20, sub:bD!==null?<div style={{fontSize:11,color:bD===0?"rgba(255,255,255,0.35)":bD<0?GOLD:"#fca5a5"}}>{diffLabel(bD)}</div>:null},
                  {lbl:"Netto",  val:has?(netto||"—"):"—",  color:GOLD,   size:18, sub:nD!==null?<div style={{fontSize:11,color:nD===0?"rgba(255,255,255,0.35)":nD<0?"#86efac":"#fca5a5"}}>{diffLabel(nD)}</div>:null},
                  {lbl:"Stblfd",val:has?stbl:"—",           color:"#86efac",size:18,sub:<div style={{fontSize:11,color:"rgba(255,255,255,0.3)"}}>pts</div>},
                ].map(({lbl,val,color,size,sub})=>(
                  <div key={lbl} style={{padding:"3px 4px",textAlign:"center",borderTop:"1px solid rgba(255,255,255,0.07)"}}>
                    <div style={{fontSize:11,fontWeight:"bold",color:"rgba(255,255,255,0.45)",letterSpacing:"0.08em",textTransform:"uppercase"}}>{lbl}</div>
                    <div style={{fontSize:size,color,fontWeight:"bold",fontFamily:"monospace",lineHeight:1.1}}>{val}</div>
                    {sub}
                  </div>
                ))}
                <div style={{padding:"3px 4px",textAlign:"center",borderTop:"1px solid rgba(255,255,255,0.07)"}}>
                  <div style={{fontSize:11,fontWeight:"bold",color:"rgba(255,255,255,0.45)",letterSpacing:"0.08em",textTransform:"uppercase"}}>Match</div>
                  {has?(
                    <div style={{display:"flex",justifyContent:"center",gap:4,marginTop:1}}>
                      <div>
                        <div style={{fontSize:17,color:"#fff",fontWeight:"bold",fontFamily:"monospace",lineHeight:1}}>{won}</div>
                        <div style={{fontSize:10,color:"rgba(255,255,255,0.35)"}}>W</div>
                      </div>
                      <div style={{color:"rgba(255,255,255,0.2)",fontSize:12,lineHeight:1.5}}>·</div>
                      <div>
                        <div style={{fontSize:17,color:"rgba(255,255,255,0.5)",fontWeight:"bold",fontFamily:"monospace",lineHeight:1}}>{halved}</div>
                        <div style={{fontSize:10,color:"rgba(255,255,255,0.3)"}}>½</div>
                      </div>
                    </div>
                  ):<div style={{fontSize:13,color:"rgba(255,255,255,0.3)"}}>—</div>}
                </div>
                {/* New HCI */}
                <div style={{padding:"4px 4px 5px",textAlign:"center",borderTop:"1px solid rgba(255,255,255,0.1)",background:"rgba(0,0,0,0.15)"}}>
                  <div style={{fontSize:10,fontWeight:"bold",color:"rgba(255,255,255,0.4)",letterSpacing:"0.06em",textTransform:"uppercase"}}>Neue HCI</div>
                  {newHci !== null ? (
                    <div style={{display:"flex",alignItems:"center",justifyContent:"center",gap:4,marginTop:2}}>
                      <span style={{fontSize:16,fontWeight:"bold",color:hciDelta<=0?"#86efac":"#fca5a5",fontFamily:"monospace"}}>{newHci}</span>
                      <span style={{fontSize:10,color:hciDelta<=0?"#86efac":"#fca5a5"}}>{hciDelta<=0?`▼${Math.abs(hciDelta)}`:`▲+${hciDelta}`}</span>
                    </div>
                  ) : (
                    <div style={{fontSize:12,color:"rgba(255,255,255,0.2)",marginTop:2}}>—</div>
                  )}
                </div>
              </div>
            );
          })}
        </div>
        <div style={{marginTop:8,display:"flex",gap:8,justifyContent:"center",flexWrap:"wrap"}}>
          {[["●",GOLD,"= Vorgabeschlag"],["W","#fff","= Loch gewonnen"],["—",MUTED,"= aufgenommen"],["↓","#86efac","= Ergebnis tippen"]].map(([sym,col,lbl])=>(
            <div key={lbl} style={{fontSize:10,color:"rgba(255,255,255,0.4)",display:"flex",gap:3,alignItems:"center"}}>
              <span style={{color:col,fontSize:sym==="●"?7:10}}>{sym}</span>{lbl}
            </div>
          ))}
        </div>
      </div>

      {/* ── Score legend ── */}
      <div style={{background:"#ede8dc",padding:"8px 10px",display:"flex",gap:8,flexWrap:"wrap",justifyContent:"center",borderTop:`1px solid ${LINE}`}}>
        {[
          {label:"Eagle", s:{color:RED, border:`2px solid ${RED}`,borderRadius:"50%",outline:`2px solid ${RED}`,outlineOffset:1}},
          {label:"Birdie",s:{color:RED, border:`2px solid ${RED}`,borderRadius:"50%"}},
          {label:"Par",   s:{color:TEXT}},
          {label:"Bogey", s:{color:TEXT,border:`2px solid ${TEXT}`}},
          {label:"Dbl.",  s:{color:TEXT,border:`2px solid ${TEXT}`,outline:`2px solid ${TEXT}`,outlineOffset:1}},
        ].map(({label,s})=>(
          <div key={label} style={{display:"flex",alignItems:"center",gap:4,fontSize:11,color:"#6b5e45"}}>
            <span style={{display:"inline-flex",alignItems:"center",justifyContent:"center",width:18,height:18,fontSize:11,fontWeight:"bold",fontFamily:"monospace",...s}}>4</span>
            {label}
          </div>
        ))}
      </div>

    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<GolfScorecard/>);
</script>
</body>
</html>
